server:
  host: 0.0.0.0
  port: 8080
webhook:
  secret: local-webhook-secret-12345
forgejo:
  url: http://forgejo-local:3000
  token: ${FORGEJO_TOKEN}
  admin_token: ${FORGEJO_ADMIN_TOKEN}
  rate_limit: 60
  role_tokens:
    pm: ${ROLE_TOKEN_PM}
    implementer: ${ROLE_TOKEN_IMPLEMENTER}
    devops: ${ROLE_TOKEN_DEVOPS}
    reviewer: ${ROLE_TOKEN_REVIEWER}
    tester: ${ROLE_TOKEN_TESTER}
  role_users:
    pm: djent-pm
    implementer: djent-dev
    devops: djent-dev
    reviewer: djent-qa
    tester: djent-qa
agent:
  max_sessions: 25
  idle_timeout: 4h
  workdir: /var/lib/fordjent/work
  max_turns: 75
  max_turns_pm: 15
  max_turns_implementer: 50
  max_turns_reviewer: 20
  # All roles use ONLY the local Gemma 4 12B model (llama.cpp server on host, :8181).
  # No external providers are configured.
  role_providers:
    pm: local-gpu
    reviewer: local-gpu
    implementer: local-gpu
    tester: local-gpu
    devops: local-gpu
  fallback_provider: local-gpu
  commit_prefix: '[agent-automation]'
  context_window: 131072
  compaction_threshold: 0.85
  compaction_keep_turns: 8
  enable_lifecycle: true
  enable_stale_gate: true
  enable_scaffold_detection: true
  enable_bug_report_dep_block: true   # A3: auto-block bug-report issues that reference open unmerged PRs
  enable_session_recovery: true
  enable_context_injection: true
  enable_auto_collaborator: true
  enable_auto_retry: true
  max_session_retries: 2
  auto_retry_delay: 5m
  # Max per-PR rework attempts before labeling `fordjent/failed:rework-exhausted`
  # + `blocked`. Covers failed CI / changes_requested / human PR comment spawns.
  max_rework_attempts: 3
  require_role_tag: true
  session_timeout: 60m
  git_name: Fordjent Dev Agent
  git_email: fordjent-dev@forgejo.local
budget:
  enabled: true
  max_session_cost: 2.0
  max_monthly_cost: 50.0
sandbox:
  enabled: false
  backend: bwrap
  tmpfs_size_mb: 64
  keep_profiles_on_failure: true
  violation_comment_threshold: 3
  allowed_write_dirs: []
providers:
- name: local-gpu
  # ONLY provider configured — all roles (pm/implementer/reviewer/tester/devops)
  # route here. Talks to the local llama.cpp server (Gemma 4 12B Q5_K_XL) on the
  # host at :8181, reached from inside the container via the docker bridge gateway.
  api_base: http://172.18.0.1:8181/v1
  model: gemma-4-12b-it-UD-Q5_K_XL.gguf
  max_tokens: 16384
  request_timeout: 120s
  max_retries: 3
  retry_base_delay: 2s
  retry_max_delay: 30s
  max_concurrent_llm_calls: 2
  cost_per_1m_input_tokens: 0
  cost_per_1m_output_tokens: 0
events:
- issues
- issue_comment
- pull_request
- pull_request_review_comment
session_key_template: '{{.Repository}}/issues/{{.IssueNumber}}'
security:
  protected_branches:
  - main
  - master
  require_pr_for_workflows: true
  filter_agent_events: true
  admin_token: "local-admin-token-12345"
memory:
  enabled: true
  compaction_cron: 0 2 * * *
  compaction_path: docs/issues
database:
  path: ''
scanner:
  enabled: true
  interval: 5m
  repo: fjadmin/runner-test
auto_register:
  enabled: true
  webhook_url: ''
log_level: info
